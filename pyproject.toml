[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "asteraskills"
version = "0.1.0"
description = "Claude Agent Skills runner for Astera security intelligence tools (CVE, ATT&CK, CWE/CAPEC, OTX, exploits, frameworks)."
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Astera Skills" }]
dependencies = [
  "typer>=0.12.0",
  "rich>=13.0.0",
  "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = ["ruff>=0.6.0"]
runtime = [
  "pydantic>=2.0",
  "pydantic-settings>=2.0",
  "sqlalchemy>=2.0",
  "psycopg2-binary>=2.9",
  "requests>=2.28",
  "langchain-core>=0.3",
  "langchain-openai>=0.3",
  "langchain-anthropic>=0.3",
  "langchain-community>=0.3",
  "langchain-chroma>=0.2",
  "langchain-text-splitters>=0.3",
  "langchain-qdrant>=0.1",
  "langgraph>=0.2",
  "chromadb>=0.5",
  "tavily-python>=0.3",
  "pyyaml>=6",
  "six>=1.16",
  "python-dateutil>=2.8",
  "pytz",
  "numpy>=1.24",
  "scikit-learn>=1.3",
  "qdrant-client>=1.7",
  "python-magic>=0.4",
  "defusedxml>=0.7",
]

[project.scripts]
asteraskills = "asteraskills.cli:app"
risk-scanner = "risk_scanner.cli:app"

[tool.setuptools.packages.find]
where = [".", "app"]
include = ["asteraskills*", "risk_scanner*"]

[tool.setuptools.package-data]
asteraskills = ["agents/prompts/*.md", "ingestion/attacktocve/prompts/*.md"]
risk_scanner = ["data/packs/.gitkeep", "core/prompts/*.md"]

[tool.pytest.ini_options]
pythonpath = ["app"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
